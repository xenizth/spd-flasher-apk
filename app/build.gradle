plugins {
    id 'com.android.application'
}

android {
    namespace 'com.spdflasher'
    compileSdk 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'com.spdflasher'
        minSdk 24
        targetSdk 34
        versionCode 10
        versionName "1.9"

        // 32-bit and 64-bit ARM phones (the source repo cares a lot about arm32)
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cFlags '-O2'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    // The built file is "SPD Tool.apk" instead of app-debug.apk
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = 'SPD Tool.apk'
        }
    }

    // Release signing: only active when the CI (or you) provides the keystore through environment variables.
    signingConfigs {
        release {
            if (System.getenv('KEYSTORE_FILE')) {
                storeFile file(System.getenv('KEYSTORE_FILE'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }
}
