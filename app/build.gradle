plugins {
    id 'com.android.application'
}

android {
    namespace 'com.spdflasher'
    compileSdk 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'com.spdflasher'
        minSdk 24
        targetSdk 34
        versionCode 9
        versionName "1.8"

        // 32-bit and 64-bit ARM phones (the source repo cares a lot about arm32)
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cFlags '-O2'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    // The built file is "SPD Tool.apk" instead of app-debug.apk
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = 'SPD Tool.apk'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
