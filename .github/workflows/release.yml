name: Release APK

# Push a tag like v1.0 (git tag v1.0 && git push origin v1.0) and this builds the
# APK and attaches it to a GitHub Release you can download from the Releases page.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. v2.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform, NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Build APK (release-signed when the keystore secrets exist)
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            ./gradlew --no-daemon assembleRelease
            cp "app/build/outputs/apk/release/SPD Tool.apk" "SPD-Tool-${TAG}.apk"
          else
            echo "No keystore secrets found - building the debug-signed APK instead"
            ./gradlew --no-daemon assembleDebug
            cp "app/build/outputs/apk/debug/SPD Tool.apk" "SPD-Tool-${TAG}.apk"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: SPD-Tool-${{ github.event.inputs.tag || github.ref_name }}.apk
