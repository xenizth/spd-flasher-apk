name: Release APK

# Push a tag like v1.0 (git tag v1.0 && git push origin v1.0) and this builds the
# APK and attaches it to a GitHub Release you can download from the Releases page.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform, NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Build debug-signed APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp "app/build/outputs/apk/debug/SPD Tool.apk" "SPD-Tool-${GITHUB_REF_NAME}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: SPD-Tool-${{ github.ref_name }}.apk
